[project]
name = "jobpilot"
version = "0.1.0"
description = "Agente autonomo de candidaturas: ingere vagas, avalia fit com o CV, gera CV e carta adaptados e monta uma fila para envio com 1 clique."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=jobpilot --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["jobpilot"]

[tool.coverage.report]
show_missing = true
skip_covered = false
